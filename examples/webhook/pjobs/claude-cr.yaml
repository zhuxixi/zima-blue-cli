apiVersion: zima.io/v1
kind: PJob
metadata:
  code: claude-cr
  name: Claude Code Review
spec:
  agent: claude
  workflow: cr-claude
  variable: cr-vars
  env: github-env
  actions:
    provider: github
    preExec:
      - type: scan_pr
        repo: "{{repo}}"
        label: "zima:needs-review"
    postExec:
      - condition: always
        type: add_comment
        repo: "{{repo}}"
        issue: "{{pr_number}}"
        body: "Code review completed by Claude."
