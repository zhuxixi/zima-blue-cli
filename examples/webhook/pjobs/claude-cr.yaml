apiVersion: zima.io/v1
kind: PJob
metadata:
  code: claude-cr
  name: Claude Code Review
spec:
  agent: claude
  workflow: cr-claude
  variables: cr-vars
  env: github-env
  actions:
    preExec:
      - provider: github
        action: scan_pr
        args:
          repo: "{{ repo }}"
          pr: "{{ pr }}"
    postExec:
      - provider: github
        action: add_comment
        condition: always
